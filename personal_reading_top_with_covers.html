    <title>Personal Reading List — 90 книг</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --fg: #161616;
        --accent: #4d7c0f;
        --panel: #e4e4e4;
        --card: #eaeaea;
        --muted: #6b6b6b;
        --muted2: #8c8c8c;
        --dim: #d6d6d6;
        --line: #161616;
        --shadow: rgba(0, 0, 0, 0.06);
      }
      html[data-theme="dark"] {
        --bg: #181818;
        --fg: #dcdcdc;
        --accent: #cdff48;
        --panel: #2a2a2a;
        --card: #232323;
        --muted: #9a9a9a;
        --muted2: #7a7a7a;
        --dim: #383838;
        --line: #e6e6e6;
        --shadow: rgba(0, 0, 0, 0.28);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
      }
      button,
      input {
        font: inherit;
      }
      .display {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 40px 64px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: 0 -40px;
        padding: 0 40px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--dim);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .mark b {
        background: var(--accent);
        color: var(--bg);
        padding: 4px 8px;
      }
      .mark span {
        color: var(--accent);
      }
      .tools {
        display: flex;
        gap: 8px;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border: 2px solid var(--dim);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .hero {
        padding: 64px 0 40px;
        border-bottom: 2px solid var(--dim);
      }
      .eyebrow {
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1,
      h2 {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        margin: 0;
        letter-spacing: -0.03em;
      }
      h1 {
        font-size: clamp(42px, 7vw, 82px);
        line-height: 0.96;
        margin-top: 16px;
        max-width: 900px;
      }
      h1 em {
        color: var(--accent);
        font-style: normal;
      }
      .lead {
        max-width: 780px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .stats {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
        margin-top: 32px;
      }
      .stat {
        min-width: 130px;
        border-left: 2px solid var(--accent);
        padding-left: 12px;
      }
      .stat strong {
        display: block;
        font-family: Inter, ui-sans-serif, system-ui;
        font-size: 26px;
        line-height: 1;
      }
      .stat span {
        display: block;
        margin-top: 8px;
        color: var(--muted2);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .controls {
        padding: 24px 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: end;
      }
      .search-label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted2);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .search {
        width: 100%;
        height: 42px;
        border: 2px solid var(--dim);
        background: var(--card);
        color: var(--fg);
        padding: 0 14px;
        outline: none;
      }
      .search:focus {
        border-color: var(--accent);
      }
      .copy {
        height: 42px;
        padding: 0 16px;
        border: 2px solid var(--accent);
        background: var(--accent);
        color: var(--bg);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
      }
      .copy:hover {
        filter: brightness(1.08);
      }
      .tabs {
        display: flex;
        gap: 22px;
        overflow: auto;
        border-bottom: 2px solid var(--dim);
        margin-bottom: 40px;
        scrollbar-width: none;
      }
      .tab {
        position: relative;
        border: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        padding: 0 0 14px;
        background: none;
        color: var(--muted2);
        cursor: pointer;
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 11px;
        font-weight: 700;
      }
      .tab span {
        margin-left: 8px;
        color: var(--muted2);
      }
      .tab:hover,
      .tab.active {
        color: var(--fg);
      }
      .tab.active {
        border-color: var(--accent);
      }
      .tab.active span {
        color: var(--accent);
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }
      .section-head h2 {
        margin-top: 12px;
        font-size: 32px;
        line-height: 1;
      }
      .section-meta {
        color: var(--muted2);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .table-wrap {
        border-top: 2px solid var(--line);
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 820px;
      }
      th,
      td {
        border-bottom: 2px solid var(--dim);
        vertical-align: top;
      }
      th {
        padding: 12px 14px;
        text-align: left;
        color: var(--muted2);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        background: var(--bg);
      }
      td {
        padding: 18px 14px;
      }
      tbody tr {
        transition: background 0.15s ease;
      }
      tbody tr:hover {
        background: var(--card);
      }
      tbody tr[data-tier="top"] .rank {
        color: var(--accent);
        font-weight: 800;
      }
      .rank {
        width: 56px;
        color: var(--muted2);
        font-variant-numeric: tabular-nums;
      }
      .book {
        width: 330px;
      }
      .title {
        font-family: Inter, ui-sans-serif, system-ui;
        font-size: 16px;
        font-weight: 750;
        line-height: 1.25;
      }
      .author {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }
      .score {
        width: 80px;
      }
      .score span {
        display: inline-block;
        min-width: 48px;
        padding: 3px 7px;
        border: 2px solid var(--dim);
        text-align: center;
        font-weight: 800;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .why {
        color: var(--muted);
        max-width: 520px;
      }
      tr.hidden {
        display: none;
      }
      .foot {
        margin-top: 56px;
        padding-top: 24px;
        border-top: 2px solid var(--dim);
        color: var(--muted2);
        font-size: 11px;
        letter-spacing: 0.04em;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .foot strong {
        color: var(--accent);
      }
      @media (max-width: 760px) {
        .shell {
          padding: 0 18px 48px;
        }
        .topbar {
          margin: 0 -18px;
          padding: 0 18px;
        }
        .hero {
          padding-top: 44px;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .copy {
          width: 100%;
        }
        .tabs {
          gap: 18px;
        }
        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }
      }
      @media print {
        :root {
          --bg: #fff;
          --fg: #111;
          --card: #fff;
          --panel: #fff;
          --dim: #bbb;
          --muted: #444;
          --muted2: #666;
          --accent: #4d7c0f;
        }
        .topbar,
        .controls,
        .tabs {
          display: none !important;
        }
        .shell {
          max-width: none;
          padding: 0;
        }
        .hero {
          padding: 0 0 20px;
        }
        h1 {
          font-size: 38px;
        }
        .panel {
          display: block !important;
          break-before: page;
        }
        .panel:first-of-type {
          break-before: auto;
        }
        table {
          min-width: 0;
          font-size: 10px;
        }
        th,
        td {
          padding: 7px 8px;
        }
        .title {
          font-size: 11px;
        }
        .author,
        .why {
          font-size: 9px;
        }
        .foot {
          display: none;
        }
      }

      .book {
        width: 390px;
      }
      .book-layout {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .book-copy {
        min-width: 0;
        padding-top: 2px;
      }
      .cover-link {
        display: block;
        width: 54px;
        height: 78px;
        text-decoration: none;
        color: inherit;
        border: 2px solid var(--dim);
        background: var(--panel);
        overflow: hidden;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .cover-link:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .cover {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background:
          linear-gradient(
            135deg,
            transparent 0 49%,
            color-mix(in srgb, var(--accent) 12%, transparent) 49% 51%,
            transparent 51%
          ),
          var(--panel);
      }
      .cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .cover.has-image img {
        opacity: 1;
      }
      .cover.has-image .cover-placeholder {
        opacity: 0;
      }
      .cover-placeholder {
        font-family: Inter, ui-sans-serif, system-ui;
        font-size: 15px;
        font-weight: 850;
        letter-spacing: -0.04em;
        color: var(--accent);
        transition: opacity 0.18s ease;
      }
      .cover.is-loading::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--accent);
        animation: coverLoad 1.1s linear infinite;
        transform-origin: left;
      }
      @keyframes coverLoad {
        0% {
          transform: scaleX(0.12);
          opacity: 0.35;
        }
        60% {
          transform: scaleX(0.72);
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 0;
        }
      }
      .cover.is-missing {
        border-left: 2px solid var(--muted2);
      }
      @media (max-width: 760px) {
        .book-layout {
          grid-template-columns: 46px minmax(0, 1fr);
          gap: 10px;
        }
        .cover-link {
          width: 46px;
          height: 68px;
        }
      }
      @media print {
        .cover-link {
          width: 36px;
          height: 52px;
          border-width: 1px;
        }
        .book-layout {
          grid-template-columns: 36px minmax(0, 1fr);
          gap: 7px;
        }
        .cover-placeholder {
          font-size: 9px;
        }
      }

      .foot a {
        color: var(--accent);
        text-decoration: none;
      }
      .foot a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

      <footer class="foot">
        <div>
          <strong>// NOTE</strong> рейтинг и число оценок взяты с LiveLib
        </div>
        <div>minimal reading index · standalone html</div>
        <div class="openlibrary-credit">
          Обложки:
          <a
            href="https://www.livelib.ru/"
            rel="noopener noreferrer"
            target="_blank"
            >LiveLib</a
          >

    </div>
    <script>
      (() => {
        const readingData = JSON.parse(
          document.getElementById("booksData").textContent,
        );
        const tabsRoot = document.getElementById("bookTabs");
        const panelsRoot = document.getElementById("bookPanels");

        function escapeHtml(value) {
          return String(value ?? "").replace(
            /[&<>"']/g,
            (char) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[char],
          );
        }

        function searchText(book) {
          return [
            book.title,
            book.author,
            book.why,
            book.originalTitle,
            book.originalAuthor,
          ]
            .filter(Boolean)
            .join(" ")
            .toLocaleLowerCase("ru");
        }

        tabsRoot.innerHTML = readingData
          .map(
            (category, index) => `
    <button class="tab${index === 0 ? " active" : ""}" data-target="${escapeHtml(category.id)}" type="button">
      ${escapeHtml(category.label)}<span>${category.books.length}</span>
    </button>`,
          )
          .join("");

        panelsRoot.innerHTML = readingData
          .map(
            (category, index) => `
    <section class="panel${index === 0 ? " active" : ""}" data-label="${escapeHtml(category.label)}" id="${escapeHtml(category.id)}">
      <div class="section-head">
        <div><div class="eyebrow">// ${escapeHtml(category.eyebrow)}</div><h2>${escapeHtml(category.title)}</h2></div>
        <div class="section-meta">${category.books.length} книг</div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>№</th><th>Автор / книга</th><th>Рейтинг LiveLib</th><th>Почему может зайти</th></tr></thead>
        <tbody>${category.books
          .map((book) => {
            const initials = book.title
              .split(/\s+/)
              .slice(0, 2)
              .map((word) => word[0] || "")
              .join("")
              .toUpperCase();
            const scoreText = book.score == null ? "—" : Number(book.score).toFixed(1);
            const scoreTitle = book.liveLibMarks
              ? `LiveLib: ${book.liveLibMarks} оценок`
              : "Рейтинг LiveLib пока отсутствует";
            return `<tr data-author="${escapeHtml(book.author)}" data-score="${book.score ?? ""}" data-search="${escapeHtml(searchText(book))}" data-tier="${escapeHtml(book.tier)}" data-title="${escapeHtml(book.title)}" data-original-title="${escapeHtml(book.originalTitle || "")}" data-original-author="${escapeHtml(book.originalAuthor || "")}" data-cover="${escapeHtml(book.cover || "")}" data-cover-link="${escapeHtml(book.coverLink || "")}">
            <td class="rank">${String(book.rank).padStart(2, "0")}</td>
            <td class="book"><div class="book-layout">
              <a aria-label="Открыть ${escapeHtml(book.title)}" class="cover-link" rel="noopener noreferrer" tabindex="-1" target="_blank">
                <div aria-hidden="true" class="cover" data-loaded="0"><img alt="" decoding="async" loading="lazy"/><span class="cover-placeholder">${escapeHtml(initials)}</span></div>
              </a>
              <div class="book-copy"><div class="title">${escapeHtml(book.title)}</div><div class="author">${escapeHtml(book.author)}</div></div>
            </div></td>
            <td class="score"><span title="${escapeHtml(scoreTitle)}">${scoreText}</span></td>
            <td class="why">${escapeHtml(book.why)}</td>
          </tr>`;
          })
          .join("")}</tbody>
      </table></div>
    </section>`,
          )
          .join("");
        const root = document.documentElement;
        const stored = localStorage.getItem("reading-theme");
        if (stored === "dark" || stored === "light")
          root.dataset.theme = stored;
        else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        )
          root.dataset.theme = "dark";

        document.getElementById("themeBtn").addEventListener("click", () => {
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          localStorage.setItem("reading-theme", root.dataset.theme);
        });

        const tabs = [...tabsRoot.querySelectorAll(".tab")];
        const panels = [...panelsRoot.querySelectorAll(".panel")];
        const search = document.getElementById("search");

        function activePanel() {
          return document.querySelector(".panel.active");
        }
        function filterRows() {
          const q = search.value.trim().toLowerCase();
          activePanel()
            .querySelectorAll("tbody tr")
            .forEach((row) => {
              row.classList.toggle(
                "hidden",
                q && !row.dataset.search.includes(q),
              );
            });
        }

        tabs.forEach((tab) =>
          tab.addEventListener("click", () => {
            tabs.forEach((t) => t.classList.toggle("active", t === tab));
            panels.forEach((p) =>
              p.classList.toggle("active", p.id === tab.dataset.target),
            );
            const selectedPanel = document.getElementById(tab.dataset.target);
            if (selectedPanel) enqueuePanelCovers(selectedPanel);
            search.value = "";
            filterRows();
            window.scrollTo({
              top: document.querySelector(".tabs").offsetTop - 68,
              behavior: "smooth",
            });
          }),
        );
        search.addEventListener("input", filterRows);

        document
          .getElementById("copyBtn")
          .addEventListener("click", async () => {
            const panel = activePanel();
            const rows = [...panel.querySelectorAll("tbody tr:not(.hidden)")];
            const lines = [
              panel.dataset.label,
              "№\tАвтор / книга\tРейтинг LiveLib\tПочему может зайти",
              ...rows.map((r) => {
                const c = r.querySelectorAll("td");
                const title = c[1].querySelector(".title").innerText;
                const author = c[1].querySelector(".author").innerText;
                return [
                  c[0].innerText,
                  `${author} — «${title}»`,
                  c[2].innerText,
                  c[3].innerText,
                ].join("\t");
              }),
            ];
            try {
              await navigator.clipboard.writeText(lines.join("\n"));
              const btn = document.getElementById("copyBtn");
              const old = btn.textContent;
              btn.textContent = "Скопировано ✓";
              setTimeout(() => (btn.textContent = old), 1400);
            } catch (e) {
              alert(
                "Не удалось скопировать автоматически. Выдели таблицу вручную.",
              );
            }
          });

        // --- Local LiveLib cover previews ---

        const coverQueue = [];
        const queuedKeys = new Set();
        let activeCoverLoads = 0;
        const MAX_PARALLEL_COVERS = 4;

        function lookupFor(row) {
          return {
            title: row.dataset.title || "",
            author: row.dataset.author || "",
            originalTitle: row.dataset.originalTitle || row.dataset.title || "",
            originalAuthor:
              row.dataset.originalAuthor || row.dataset.author || "",
            cover: row.dataset.cover || "",
            coverLink: row.dataset.coverLink || "",
          };
        }

        function coverKey(row) {
          const book = lookupFor(row);
          return `${book.title}||${book.author}||${book.originalTitle}||${book.originalAuthor}`.toLocaleLowerCase(
            "ru",
          );
        }

        function applyCover(row, data) {
          const cover = row.querySelector(".cover");
          const img = cover?.querySelector("img");
          const link = row.querySelector(".cover-link");
          if (!cover || !img || !link) return;

          cover.classList.remove("is-loading");
          cover.dataset.loaded = "1";

          if (data && data.coverUrl) {
            img.onload = () => {
              cover.classList.remove("is-missing");
              cover.classList.add("has-image");
            };
            img.onerror = () => {
              cover.classList.remove("has-image");
              cover.classList.add("is-missing");
            };
            img.referrerPolicy = "no-referrer";
            img.src = data.coverUrl;
            if (data.workUrl) {
              link.href = data.workUrl;
              link.tabIndex = 0;
            } else {
              link.removeAttribute("href");
              link.tabIndex = -1;
            }
          } else {
            cover.classList.add("is-missing");
            link.removeAttribute("href");
            link.tabIndex = -1;
          }
        }

        async function fetchCover(row) {
          const cover = row.querySelector(".cover");
          cover?.classList.add("is-loading");
          const book = lookupFor(row);
          const data = book.cover
            ? { coverUrl: book.cover, workUrl: book.coverLink, source: "livelib" }
            : null;
          applyCover(row, data);
        }

        function enqueueCover(row) {
          const cover = row.querySelector(".cover");
          if (!cover || cover.dataset.loaded === "1") return;
          const key = coverKey(row);
          if (queuedKeys.has(key)) return;
          queuedKeys.add(key);
          coverQueue.push(row);
          runCoverQueue();
        }

        function enqueuePanelCovers(panel) {
          panel.querySelectorAll('.cover[data-loaded="0"]').forEach((cover) => {
            const row = cover.closest("tr");
            if (row) enqueueCover(row);
          });
        }

        function runCoverQueue() {
          while (activeCoverLoads < MAX_PARALLEL_COVERS && coverQueue.length) {
            const row = coverQueue.shift();
            queuedKeys.delete(coverKey(row));
            activeCoverLoads += 1;
            fetchCover(row).finally(() => {
              activeCoverLoads -= 1;
              setTimeout(runCoverQueue, 120);
            });
          }
        }

        const coverObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const row = entry.target.closest("tr");
                if (row) enqueueCover(row);
                coverObserver.unobserve(entry.target);
              }
            });
          },
          { rootMargin: "650px 0px" },
        );

        document
          .querySelectorAll('.cover[data-loaded="0"]')
          .forEach((c) => coverObserver.observe(c));
        enqueuePanelCovers(activePanel());
      })();
    </script>
